[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opo-response-compatibility"
version = "0.1.0"
description = "Legacy OPO UI response compatibility for the shared runtime"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["src"]
