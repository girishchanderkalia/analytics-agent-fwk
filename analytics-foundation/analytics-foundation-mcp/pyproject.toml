[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-foundation-mcp"
version = "0.1.0"
description = "MCP tool backend for the Analytics Foundation API"
requires-python = ">=3.13"
dependencies = [
  "analytics-foundation-client>=0.1.0",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.34,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
