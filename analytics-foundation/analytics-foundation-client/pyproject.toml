[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-foundation-client"
version = "0.1.0"
description = "Shared async HTTP client for the Analytics Foundation API"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
