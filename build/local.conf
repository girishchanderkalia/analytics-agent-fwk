# Local Kubernetes deployment (Docker Desktop or kind) for
# build/build-containers.sh and build/deploy.sh. KEY=VALUE lines only.
# Images are imported straight into the cluster nodes' containerd; no registry.

TARGET=local

# Tag of the images built in the local Docker image store (<name>:<IMAGE_TAG>).
IMAGE_TAG=local

# kubectl context of the local cluster; empty = current context.
# e.g. docker-desktop or kind-<cluster-name>
KUBE_CONTEXT=

# ingress-nginx controller version installed/upgraded by build/deploy.sh when
# the cluster does not run it yet; empty = do not manage an ingress controller.
INGRESS_NGINX_VERSION=1.15.1

# Host name of the OPO Monitoring Ingress; empty = deploy/k8s/ingress.yaml.
# localhost serves the UI on http://localhost without a hosts-file entry.
INGRESS_HOST=localhost

# Env file build/deploy.sh reads Secret values (MODEL_GATEWAY_API_KEY,
# LANADB_*) from; empty = repo-root .env. See .env.example.
SECRETS_ENV_FILE=
