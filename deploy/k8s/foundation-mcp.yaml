apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-foundation-mcp-config
  namespace: ai-agent-fwk
data:
  ANALYTICS_FOUNDATION_BASE_URL: http://analytics-foundation-api:8200
  LANADB_MCP_URL: http://lanadb-mcp:8400/mcp
  LANADB_MAX_ROWS: "10000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-foundation-mcp
  namespace: ai-agent-fwk
  labels:
    app.kubernetes.io/name: analytics-foundation-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-foundation-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-foundation-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: mcp
          image: analytics-foundation-mcp:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8300
          envFrom:
            - configMapRef:
                name: analytics-foundation-mcp-config
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-foundation-mcp
  namespace: ai-agent-fwk
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: analytics-foundation-mcp
  ports:
    - name: http
      port: 8300
      targetPort: http
