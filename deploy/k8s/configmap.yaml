apiVersion: v1
kind: ConfigMap
metadata:
  name: application-agent-runtime-config
  namespace: ai-agent-fwk
data:
  AGENT_APPLICATION_ID: opo-monitoring
  AGENT_MARKDOWN_PACKAGES: /app/agents/opo-monitoring
  AGENT_APPLICATION_PACKAGES: '{"overlay-data-analysis":["/app/agents/overlay-analysis"]}'
  AGENT_RUNTIME_DATABASE_PATH: /app/runtime-data/conversations.sqlite
  AGENT_RUNTIME_CHECKPOINTER_BACKEND: memory
  SSL_CERT_FILE: /etc/ssl/asml/combined-ca-bundle.pem
  MODEL_GATEWAY_ENDPOINT: REPLACE_WITH_MODEL_GATEWAY_ENDPOINT
  MODEL_GATEWAY_MODEL: REPLACE_WITH_MODEL_NAME
  ANALYTICS_FOUNDATION_MCP_URL: REPLACE_WITH_ANALYTICS_FOUNDATION_MCP_URL
  OPO_CAPABILITY_MCP_URL: REPLACE_WITH_OPO_CAPABILITY_MCP_URL
