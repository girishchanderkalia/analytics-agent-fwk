apiVersion: apps/v1
kind: Deployment
metadata:
  name: application-agent-runtime
  namespace: ai-agent-fwk
  labels:
    app.kubernetes.io/name: application-agent-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: application-agent-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: application-agent-runtime
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: runtime
          image: application-agent-runtime:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: application-agent-runtime-config
            - secretRef:
                name: application-agent-runtime-secrets
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: runtime-data
              mountPath: /app/runtime-data
            - name: tmp
              mountPath: /tmp
            - name: ca-bundle
              mountPath: /etc/agent-runtime/ca
              readOnly: true
      volumes:
        - name: runtime-data
          persistentVolumeClaim:
            claimName: application-agent-runtime-data
        - name: tmp
          emptyDir: {}
        - name: ca-bundle
          configMap:
            name: application-agent-runtime-ca-bundle
            optional: true
