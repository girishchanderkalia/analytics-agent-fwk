apiVersion: v1
kind: ConfigMap
metadata:
  name: lanadb-mcp-config
  namespace: ai-agent-fwk
data:
  LANADB_MCP_HOST: 0.0.0.0
  LANADB_MCP_PORT: "8400"
  LANADB_SCHEMA: lisa
  LANADB_MAX_ROWS: "10000"
  LANADB_POOL_SIZE: "5"
  LANADB_QUERY_TIMEOUT_SECONDS: "60"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lanadb-mcp
  namespace: ai-agent-fwk
  labels:
    app.kubernetes.io/name: lanadb-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lanadb-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lanadb-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: lanadb-mcp
          image: lanadb-mcp:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8400
          envFrom:
            - configMapRef:
                name: lanadb-mcp-config
            - secretRef:
                name: lanadb-mcp-secrets
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lanadb-mcp
  namespace: ai-agent-fwk
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lanadb-mcp
  ports:
    - name: http
      port: 8400
      targetPort: http
