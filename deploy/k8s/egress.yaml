# Istio mesh outboundTrafficPolicy on this cluster is REGISTRY_ONLY, so any
# external host the runtime calls directly (not through a mesh Service) must
# be registered here or the sidecar drops the connection (ConnectError /
# SSLEOFError, depending on timing).
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: model-gateway-egress
  namespace: ai-agent-fwk
spec:
  hosts:
    - platform.ai.asml.com
  location: MESH_EXTERNAL
  ports:
    - name: https
      number: 443
      protocol: TLS
  resolution: DNS

